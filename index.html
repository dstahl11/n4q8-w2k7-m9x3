<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="googlebot" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hugo and Theo School Stuff">
  <meta name="description" content="Hugo and Theo school stuff">
  <title>Hugo and Theo School Stuff</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script>
    try {
      if (sessionStorage.getItem("stahl-school-ok") === "1") {
        document.documentElement.classList.add("unlocked");
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="gate" class="gate" role="dialog" aria-labelledby="gate-title" aria-modal="true">
    <h1 id="gate-title">Hugo and Theo School Stuff</h1>
    <p class="lede">Type the PIN</p>
    <div id="pin-dots" class="pin-dots" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div id="pin-pad" class="pin-pad" role="group" aria-label="PIN keypad">
      <button type="button" data-k="1">1</button>
      <button type="button" data-k="2">2</button>
      <button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button>
      <button type="button" data-k="5">5</button>
      <button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button>
      <button type="button" data-k="8">8</button>
      <button type="button" data-k="9">9</button>
      <button type="button" class="ghost" tabindex="-1" aria-hidden="true"></button>
      <button type="button" data-k="0">0</button>
      <button type="button" class="ghost" data-k="del" aria-label="Delete">⌫</button>
    </div>
    <p id="pin-err" class="err" role="status" aria-live="polite"></p>
  </div>

  <main id="app" class="app" hidden></main>

  <noscript>
    <p class="noscript">This dashboard needs JavaScript turned on.</p>
  </noscript>
  <script src="./app.js" defer></script>
</body>
</html>
